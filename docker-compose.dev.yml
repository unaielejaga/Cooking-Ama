version: '3.8'

services:
  cooking-ama:
    build:
      context: ./code
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:80"
      - "8081:8081"
    volumes:
      - ./code:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - cooking-ama-network
